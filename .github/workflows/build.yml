name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:       # allow manual trigger from Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create assets folder (placeholder icon)
        run: |
          mkdir -p assets
          # If no icon exists, PyInstaller uses default — skip error
          if (!(Test-Path "assets/icon.ico")) {
            Write-Host "No icon found, building without custom icon."
          }
        shell: pwsh

      - name: Build with PyInstaller
        run: |
          pyinstaller installer/build.spec --distpath dist --workpath build
        shell: pwsh

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/setup.iss
          options: /O+

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaSetup-${{ github.sha }}
          path: installer/Output/LuminaSetup.exe
          retention-days: 30
